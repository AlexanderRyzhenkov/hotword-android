name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare pinned Russian model at build time
        run: bash scripts/prepare-bundled-model.sh
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Assemble APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK contains the correct offline model
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import zipfile
          apk = pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          expected = pathlib.Path('models/ru.sha256').read_text().strip()
          with zipfile.ZipFile(apk) as archive:
              model = archive.read('assets/models/ru.zip')
          assert hashlib.sha256(model).hexdigest() == expected, "Model missing or damaged"
          print(f"Verified bundled model: {len(model)/1024/1024:.1f} MiB")
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hotword-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
