name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Cache pinned PocketSphinx build inputs
        uses: actions/cache@v4
        with:
          path: |
            app/libs/pocketsphinx-android-5prealpha-release.aar
            app/src/main/assets/pocketsphinx/ru
          key: pocketsphinx-v1-${{ runner.os }}-${{ hashFiles('models/pocketsphinx-ru.sha256', 'scripts/prepare-pocketsphinx.sh') }}
      - name: Prepare PocketSphinx and Russian acoustic model
        run: bash scripts/prepare-pocketsphinx.sh
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Assemble APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK contains PocketSphinx and no Vosk model
        run: |
          python3 - <<'PY'
          import pathlib
          import zipfile

          apk = pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          required = {
              'assets/pocketsphinx/ru/feat.params',
              'assets/pocketsphinx/ru/feature_transform',
              'assets/pocketsphinx/ru/mdef',
              'assets/pocketsphinx/ru/means',
              'assets/pocketsphinx/ru/mixture_weights',
              'assets/pocketsphinx/ru/noisedict',
              'assets/pocketsphinx/ru/transition_matrices',
              'assets/pocketsphinx/ru/variances',
              'assets/pocketsphinx/ru/ru.lexicon',
          }
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              missing = required - names
              assert not missing, f'Missing PocketSphinx assets: {sorted(missing)}'
              assert 'assets/models/ru.zip' not in names, 'Legacy Vosk model is still bundled'
              native = [n for n in names if n.endswith('/libpocketsphinx_jni.so')]
              assert native, 'PocketSphinx JNI library missing from APK'
              size = sum(archive.getinfo(n).file_size for n in required)
          print(f'PocketSphinx acoustic assets: {size / 1024 / 1024:.1f} MiB')
          print('PocketSphinx JNI:', ', '.join(native))
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hotword-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
